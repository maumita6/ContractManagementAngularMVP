<!-- Recent Contracts-->
<div class="min-h-screen bg-gray-50 flex flex-column align-items-center">
    <div class="w-full md:w-12 flex flex-column gap-4 py-4 px-3 md:px-0">
        <div class="flex flex-column gap-3">
            <h2 class="text-base font-bold text-800 m-0">Recent Contracts</h2>

            <p-card styleClass="border-1 border-200 shadow-1">
                <p-table [value]="recentContracts" responsiveLayout="scroll" styleClass="p-datatable-striped">
                    <ng-template pTemplate="header">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Status</th>
                            <th>Created At</th>
                        </tr>
                    </ng-template>

                    <ng-template pTemplate="body" let-contract>
                        <tr>
                            <td class="text-primary font-medium">{{ contract.id }}</td>
                            <td>{{ contract.title }}</td>
                            <td>
                                <span [class]="
                            'border-round px-2 py-1 text-xs font-medium ' +
                            (contract.status === 'Pending'
                              ? 'bg-orange-100 text-orange-800'
                              : 'bg-green-100 text-green-800')
                          ">
                                    {{ contract.status }}
                                </span>
                            </td>
                            <td>{{ contract.createdAt | date: 'short' }}</td>
                        </tr>
                    </ng-template>
                </p-table>

                <div class="text-right mt-3">
                    <button pButton type="button" label="View All" icon="pi pi-arrow-right"
                        (click)="viewAllContracts()"></button>
                </div>
            </p-card>
        </div>
    </div>
</div>
