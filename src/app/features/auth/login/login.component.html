<p-toast></p-toast>

<div class="flex justify-content-center align-items-center min-h-screen bg-gray-50">
    <p-card header="Login" [style]="{ width: '420px', 'box-shadow': '0 4px 10px rgba(0,0,0,0.05)' }">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-4">

            <!-- Email Field -->
            <div class="flex flex-column gap-2">
                <label for="email" class="font-semibold text-color-secondary">Email</label>
                <span class="p-input-icon-left w-full">
                    <i class="pi pi-envelope"></i>
                    <input pInputText id="email" formControlName="email" placeholder="Enter your email" class="w-full"
                        [ngClass]="{ 'ng-invalid ng-dirty': loginForm.get('email')?.invalid && loginForm.get('email')?.touched }" />
                </span>
                <small class="p-error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                    <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
                    <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email address.</span>
                </small>
            </div>

            <!-- Password Field -->
            <div class="flex flex-column gap-2">
                <label for="password" class="font-semibold text-color-secondary">Password</label>
                <p-password id="password" formControlName="password" placeholder="Enter your password"
                    [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full"
                    [ngClass]="{ 'ng-invalid ng-dirty': loginForm.get('password')?.invalid && loginForm.get('password')?.touched }">
                </p-password>
                <small class="p-error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                    Password is required.
                </small>
            </div>

            <!-- Submit Button -->
            <p-button label="Login" icon="pi pi-sign-in" type="submit" styleClass="w-full mt-2" [loading]="loading"
                [disabled]="loginForm.invalid">
            </p-button>
            <div class="mt-1 text-center">
                <span class="text-600 font-regular mr-2">Don't have an account?</span>
                <p-button label="Sign Up" styleClass="p-button-text font-semibold" routerLink="/register">
                </p-button>
            </div>

        </form>
    </p-card>
</div>
